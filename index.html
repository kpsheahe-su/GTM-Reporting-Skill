<title>Soccer GTM Performance (Demo)</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--ink:#1d2433;--muted:#6b7385;--line:#e3e6ec;--accent:#1f6feb;--accent2:#7aa7f0;--warn:#b45309;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e8ecf4;--muted:#9aa3b8;--line:#2a3347;--accent:#5b9cff;--accent2:#3b6fc4;--warn:#f59e0b;}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf4;--muted:#9aa3b8;--line:#2a3347;--accent:#5b9cff;--accent2:#3b6fc4;--warn:#f59e0b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
.banner{background:#fff4e0;color:#7a4a00;border:1px solid #f1d29a;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
:root[data-theme="dark"] .banner,@media (prefers-color-scheme: dark){}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg button,.tabs button,.metric button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.seg button.on,.tabs button.on,.metric button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:20px;font-weight:600;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
tr.total td{font-weight:600;border-top:2px solid var(--line)}
.row{display:grid;grid-template-columns:200px 1fr 90px;gap:10px;align-items:center;padding:5px 0}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--line);border-radius:6px;height:14px;overflow:hidden}
.fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:6px}
.val{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.pos{color:#15803d}.neg{color:#b91c1c}
td{font-variant-numeric:tabular-nums}
@media (max-width:620px){.row{grid-template-columns:120px 1fr 80px}}
</style>
</head>

</div>

const SEGS = ["Total", "Ex-sharp", "Sharp"];
const TABS = ["Overall", "Market groups", "Tournaments", "Micro & live", "Deciles", "Movement"];
let seg = "Total", tab = "Overall", metric = "handle";
const METRICS = {handle:"Handle", ggr:"GGR", margin:"Margin", legs:"Legs", bets:"Bets"};

const fmtMoney = v => "$" + (v >= 1e6 ? (v/1e6).toFixed(1) + "M" : Math.round(v/1e3) + "K");
const fmtNum = v => Math.round(v).toLocaleString();
const fmtPct = v => (v*100).toFixed(1) + "%";
const fmt = (k, v) => k === "margin" ? fmtPct(v) : (k === "handle" || k === "ggr") ? fmtMoney(v) : fmtNum(v);

function el(id){ return document.getElementById(id); }

function renderChrome(){
  el("seg").innerHTML = SEGS.map(s => `<button class="${s===seg?'on':''}" data-s="${s}">${s}</button>`).join("");
  el("tabs").innerHTML = TABS.map(t => `<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join("");
  el("seg").querySelectorAll("button").forEach(b => b.onclick = () => { seg = b.dataset.s; render(); });
  el("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
}

function kpis(){
  const t = DATA.segments[seg].total;
  const tiles = [["Handle", fmtMoney(t.handle)], ["GGR", fmtMoney(t.ggr)], ["Margin", fmtPct(t.margin)],
                 ["Legs", fmtNum(t.legs)], ["Bets", fmtNum(t.bets)], ["Actives", fmtNum(t.actives)]];
  el("kpis").innerHTML = tiles.map(([l,v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
}

function metricPicker(){
  return `<div class="grp metric" style="margin-bottom:10px">` +
    Object.entries(METRICS).map(([k,l]) => `<button class="${k===metric?'on':''}" data-m="${k}">${l}</button>`).join("") + `</div>`;
}

function bars(rows){
  const max = Math.max(...rows.map(r => r.v));
  return rows.map(r => `<div class="row"><div class="name" title="${r.name}">${r.name}</div>
     <div class="track"><div class="fill" style="width:${(r.v/max*100).toFixed(1)}%"></div></div>
     <div class="val">${fmt(metric, r.v)}</div></div>`).join("");
}

function wireMetric(){
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { metric = b.dataset.m; render(); });
}

function table(rows, total){
  const head = `<tr><th>Group</th><th>Handle</th><th>GGR</th><th>Margin</th><th>Legs</th><th>Bets</th></tr>`;
  const body = rows.map(r => `<tr><td>${r.name}</td><td>${fmtMoney(r.handle)}</td><td>${fmtMoney(r.ggr)}</td>
     <td>${fmtPct(r.margin)}</td><td>${fmtNum(r.legs)}</td><td>${fmtNum(r.bets)}</td></tr>`).join("");
  const t = total;
  return `<table>${head}${body}<tr class="total"><td>Total</td><td>${fmtMoney(t.handle)}</td><td>${fmtMoney(t.ggr)}</td>
     <td>${fmtPct(t.margin)}</td><td>${fmtNum(t.legs)}</td><td>${fmtNum(t.bets)}</td></tr></table>`;
}

function overall(){
  const s = DATA.segments[seg];
  const rows = Object.entries(s.markets).map(([name, m]) => ({name, ...m})).sort((a,b) => b.handle - a.handle);
  const ts = Object.entries(s.tournaments).map(([name, m]) => ({name, ...m})).sort((a,b) => b.handle - a.handle);
  return `<div class="card"><h2>Handle by market group</h2>${metricPicker()}
    ${bars(rows.map(r => ({name: r.name, v: r[metric]})))}</div>
    <div class="card"><h2>Top tournaments</h2>${metricPicker()}
    ${bars(ts.slice(0,6).map(r => ({name: r.name, v: r[metric]})))}</div>`;
}

function marketTab(){
  const s = DATA.segments[seg];
  const rows = Object.entries(s.markets).map(([name, m]) => ({name, ...m})).sort((a,b) => b.handle - a.handle);
  return `<div class="card"><h2>Market groups</h2>${table(rows, s.total)}
    <div class="note">Each group uses the same definitions as the main report: handle is net stake, bets count parlays once, margin is GGR plus promo costs over gross stake.</div></div>`;
}

function tournamentTab(){
  const s = DATA.segments[seg];
  const rows = Object.entries(s.tournaments).map(([name, m]) => ({name: `${name} · ${m.region}`, ...m}))
    .sort((a,b) => b.handle - a.handle);
  return `<div class="card"><h2>Tournaments</h2>${table(rows, s.total)}</div>`;
}

function microTab(){
  const s = DATA.segments[seg];
  const rows = Object.entries(s.markets).map(([name, m]) => {
    const live = m.live, pre = m.handle - m.live;
    return {name, live, pre, liveShare: live / m.handle};
  }).sort((a,b) => b.live - a.live);
  const r = rows.map(x => `<tr><td>${x.name}</td><td>${fmtMoney(x.pre)}</td><td>${fmtMoney(x.live)}</td><td>${fmtPct(x.liveShare)}</td></tr>`).join("");
  return `<div class="card"><h2>Live vs pre-live handle</h2>
    <table><tr><th>Market group</th><th>Pre-live</th><th>Live</th><th>Live share</th></tr>${r}</table>
    <div class="note">Live is the in-play flag on each leg. Micro markets are shown by group; this demo does not split them out.</div></div>`;
}

const signed = v => (v >= 0 ? "+" : "") + v.toFixed(1);
function decileTab(){
  const y = DATA.yoy;
  const totalChange = y.total_change_pct * 100;
  const r = y.rows.map(x => {
    const chg = x.change_pct * 100;
    const cls = chg >= 0 ? "pos" : "neg";
    return `<tr><td>${x.band}</td><td>${fmtNum(x.ly_customers)}</td><td>${fmtNum(x.cy_customers)}</td>
      <td>${fmtMoney(x.ly_handle)}</td><td>${fmtMoney(x.cy_handle)}</td>
      <td class="${cls}">${signed(chg)}%</td>
      <td class="${cls}">${signed(x.contrib_pts * 100)} pts</td>
      <td>${fmtPct(x.share_of_change)}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>Deciles: LY vs CY and contribution to change</h2>
    <table><tr><th>Band</th><th>LY customers</th><th>CY customers</th><th>LY handle</th><th>CY handle</th>
      <th>Change</th><th>Contribution</th><th>Share of change</th></tr>${r}
      <tr class="total"><td>Total</td><td>${fmtNum(y.rows.reduce((a,b)=>a+b.ly_customers,0))}</td>
      <td>${fmtNum(y.rows.reduce((a,b)=>a+b.cy_customers,0))}</td><td>${fmtMoney(y.ly_handle)}</td>
      <td>${fmtMoney(y.cy_handle)}</td><td class="${totalChange>=0?'pos':'neg'}">${signed(totalChange)}%</td>
      <td>${signed(totalChange)} pts</td><td>100.0%</td></tr></table>
    <div class="note">Contribution is each band's change in handle as points of last year's total, so the column sums to the overall change. Share of change sums to 100% and shows which bands drove the movement. Customers in the Not active column in CY are not counted in any CY band.</div></div>`;
}

function movementTab(){
  const y = DATA.yoy;
  const n = y.bands.length;
  const rowTotals = y.matrix.map(r => r.reduce((a,b)=>a+b,0));
  const head = `<tr><th>LY band \\ CY band</th>${y.bands.map(b => `<th>${b}</th>`).join("")}<th>Total</th></tr>`;
  const body = y.matrix.map((row, i) => {
    const cells = row.map((v, j) => {
      const pct = rowTotals[i] ? v / rowTotals[i] : 0;
      const alpha = (pct * 0.85).toFixed(2);
      return `<td style="background:rgba(31,111,235,${alpha});color:${pct>0.5?'#fff':'inherit'}" title="${fmtNum(v)} customers">${fmtPct(pct)}</td>`;
    }).join("");
    return `<tr><td>${y.bands[i]}</td>${cells}<td>${fmtNum(rowTotals[i])}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>Movement: LY band to CY band</h2>
    <div class="note" style="margin:0 0 8px">Each row shows where last year's customers in that band ended up this year, as a share of the row. The diagonal is customers who stayed in their band. Moves above the diagonal are customers who moved to a higher band.</div>
    <div style="overflow-x:auto"><table style="font-size:12px"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="note">Counts are dummy. Hover a cell for the customer count.</div></div>`;
}

function render(){
  renderChrome(); kpis();
  const c = el("content");
  if (tab === "Overall") c.innerHTML = overall();
  else if (tab === "Market groups") c.innerHTML = marketTab();
  else if (tab === "Tournaments") c.innerHTML = tournamentTab();
  else if (tab === "Micro & live") c.innerHTML = microTab();
  else if (tab === "Movement") c.innerHTML = movementTab();
  else c.innerHTML = decileTab();
  wireMetric();
}
render();
</script>
